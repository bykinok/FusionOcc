data:
  dataset: Occ3D_nuScenes
  expected_official_val_samples: 6019
  freeze_training_split: true
  partition_unit: scene
  partition_seed: 20260927
  val_calibration_fraction: 0.20
  val_development_fraction: 0.40
  val_confirmation_fraction: 0.40
  prior_full_val_exposure: true
  label_confirmation_as_pristine_test: false
  require_split_hash: true
  require_temporal_scene_boundary_check: true
  split_policy: reuse_existing_frozen_scene_split_else_retrospective_val_20_40_40
  split_status: "GENERATED 2026-09-27 -- research_v2/splits/stcocc-nuscenes_infos_val_{calibration,development,confirmation}.pkl (30/60/60 scenes, 1202/2410/2407 samples), hash in research_v2/splits/split_manifest_materialized.json. Unrelated pre-existing 50/50 calib/eval pkls (data/nuscenes/stcocc-nuscenes_infos_val_{calib,eval}.pkl) from a prior, different calibration study were NOT reused (different fractions/scope)."
  fresh_train_holdout_for_existing_checkpoints: false
  train_holdout_change_requires_comparable_retraining: true
  allow_automatic_resplit: false
  new_candidate_selection_on_confirmation: false

loss_policy:
  mode: controlled_partial_v1
  actual_classification_kind: "sigmoid focal loss (mmcv.ops.sigmoid_focal_loss / py_sigmoid_focal_loss CPU fallback), confirmed by code reading, NOT plain softmax CE"
  free_index: 17
  ignore_indices: [255]
  applied_heads: "single primary occupancy_head, 4 scales (1/1,1/2,1/4,1/8)"
  classification_reduction: "weighted mean over included voxels, reduces to plain mean at voxel_weight=None/all-ones (bit-identical, re-verified in this pass: test_lambda1_equivalence still PASS)"
  sem_scal_weighting: weighted_sufficient_statistics    # RESOLVED, matches template
  geo_scal_weighting: weighted_sufficient_statistics    # RESOLVED, matches template
  lovasz: unchanged_and_explicitly_reported             # RESOLVED -- confirmed never reweighted at any lambda, quantified via lovasz_relative_share test this pass
  preserve_legacy_partial_as_separate_policy: true      # N/A, no distinct legacy_partial exists (unchanged conclusion from v1)
  require_all_ones_gradient_equivalence: true           # SATISFIED (re-verified this pass)
  require_per_loss_gradient_coverage_test: true         # SATISFIED for CE/sem_scal/geo_scal; Lovasz/CustomFocalLoss-CUDA-term still not directly unit-tested (same v1 gap)
  assume_lower_lambda_increases_lovasz_relative_effect: false   # per template's instruction NOT to assume -- CHECKED THIS PASS instead (see loss_inventory_v2_addendum.json lovasz_relative_share_vs_lambda): confirmed true directionally on synthetic data, magnitude not extrapolated to real batches
  measure_per_loss_gradient_norms: true    # DONE this pass, see gradient_coverage_v2.csv
  allterm_harddrop_is_separate_diagnostic: true   # DONE this pass via ignore_index-relabel mechanism, distinct from voxel_weight=0

selection:
  primary_checkpoint: last_epoch
  primary_checkpoint_variant: "UNRESOLVED -- raw vs EMA, unchanged HIGH-severity open item from v1 (D03)"
  criteria_provenance: "v1 provisional operating margins, not official acceptance criteria (verbatim template field, acknowledged, unchanged)"
  freeze_before_new_results: true
  compare_same_ray_constraints: true
  finite_grid_frontier_is_upper_bound: false
  frontier_above_interpretation: SUPPORTS_ADDITIONAL_TRAINING_EFFECT_IN_CHECKED_SCOPE
  frontier_matched_interpretation: ADDITIONAL_TRAINING_EFFECT_NOT_ESTABLISHED
  no_auto_mechanism_rejection: true
  raymean_max_drop_fraction: 0.002
  ray1_max_drop_fraction: 0.005
  miou_min_useful_gain_fraction: 0.010
  numerical_tie_tolerance: 0.000001
  ordered_ties: [lower_ece, lower_training_gpu_hours]
  no_feasible_candidate_action: report_nondominated_exploratory_candidates
  allow_posthoc_threshold_relaxation: false

statistics:
  full_seeds: [0, 1, 2]
  screen_seeds: [0]           # CONFIRMED: all 6 legacy runs are seed 0 only
  bootstrap_unit: scene
  bootstrap_repeats: 2000
  paired_comparisons: true
  noninferiority_one_sided_confidence: 0.95
  report_training_seed_sd_separately: true
  non_significance_implies_equivalence: false
  origin_iou_averaging: aggregate_sufficient_statistics_not_average_slices

stages:
  P0:
    enabled: true
    approved: false
    status: THIS_PASS
    max_new_training_jobs: 0
    training_jobs_run_this_pass: 0
    evaluation_jobs_run_this_pass: 0   # v2: CPU-only unit tests only, zero GPU evaluation jobs run
    outputs_produced: [loss_inventory_v2_addendum.json, gradient_coverage_v2.csv, protocol_manifest.json, annotation_manifest.json, split_manifest.json, legacy_reuse.json, P0_audit.md]
  E1:
    enabled: true
    approved: true                     # RESOLVED 2026-09-27: user authorized generous resource use ("문제가 되지 않는 한 자원을 충분히 활용해줘"); eval-only, no training
    depends_on: [P0]
    status: "COMPLETE (diagnostic scope: calibration split only, 3 checkpoints) -- see research_v2/reports/E1_execution_plan.md section 'Results'. bias_frontier_sweep.py run on nomask/cameramask/l025; RayIoU-level bias sweep NOT run (mIoU-only diagnostic, by design -- see plan)."
    max_new_training_jobs: 0
    requires: [P0_PASS, EVAL_RESOURCE_APPROVAL]
    eval_resource_approval_status: "GRANTED 2026-09-27 -- max_evaluation_gpu_hours=40, max_evaluation_jobs=20"
    outputs_produced: [research_v2/diagnostics/E1_bias/nomask_bias_sweep.csv, cameramask_bias_sweep.csv, cameramask_bias_sweep_extended.csv, l025_bias_sweep.csv]
    key_finding: "cameramask (w/mask) native decode is far from its own post-hoc mIoU optimum (peak near delta=+5, still +0.012 mIoU above delta=0) and even at that optimum remains far below nomask/l025's native mIoU -- a bias shift alone does not close the invisible-region gap for cameramask."
  E2:
    enabled: true
    approved: true                     # RESOLVED 2026-09-27, same authorization as E1
    depends_on: [P0]
    status: "COMPLETE (full 6019-sample val set, all 3 checkpoints) -- see research_v2/reports/E2_execution_plan.md section 'Results'."
    max_new_training_jobs: 0
    requires: [P0_PASS, ORIGIN_METADATA_AUDIT, EVAL_RESOURCE_APPROVAL]
    origin_metadata_audit_status: "DONE this pass -- see loss_inventory_v2_addendum.json rayiou_origin_builder_audit. This requirement IS satisfied; EVAL_RESOURCE_APPROVAL now also satisfied."
    outputs_produced: "/NAS/work_dirs/research_v2_e2_decomp/{nomask,cameramask,l025}_rayiou_decomp/ (work_dir logs; origin-decomposition tables read directly from these run logs)"
    key_finding: "For all 3 checkpoints, RayIoU by origin time-offset is reference > past > future (e.g. nomask IoU@2: ref=0.455, past=0.388, future=0.357). Future-relative-to-reference origins are the HARDEST condition, not an easy one -- the v2 concern that RayIoU might inflate scores via future-origin leakage is NOT supported by this evidence for these 3 checkpoints. Per v2 judgment rule, this is evidence to report, not grounds to dismiss any candidate."
  E3:
    enabled: true
    approved: true                      # RESOLVED 2026-09-29, user authorized minimal training explicitly
    depends_on: [E1, E2]
    status: "STARTING -- radius-piecewise adaptive lambda_inv_free probe, 2 variants (n010_f050 on local, n010_f100 queued for remote/local depending on GPU availability). New branch: stcocc-selective-free-supervision (both local and remote mando-h100_2 checked out to it)."
    max_new_training_jobs: 2
    configs: [stcocc_r50_704x256_16f_occ3d_e12_stage3_adaptive_r20_n010_f050.py, stcocc_r50_704x256_16f_occ3d_e12_stage3_adaptive_r20_n010_f100.py]
    baseline_for_comparison: stcocc_r50_704x256_16f_occ3d_e12_stage2_invfree_l025.py (flat lambda=0.25, already trained, no retrain needed)
  E4:
    enabled: false
    approved: false
    depends_on: [E3]
    status: NOT_STARTED
  E5:
    enabled: false
    approved: false
    depends_on: [E3]
    status: NOT_STARTED
  M:
    enabled: false
    approved: false
    depends_on: [E4, E5]
    status: NOT_STARTED
  F1:
    enabled: false
    approved: false
    depends_on: [M]
    status: NOT_STARTED
  F2:
    enabled: false
    approved: false
    depends_on: [F1]
    status: NOT_STARTED
  R:
    enabled: true
    approved: false
    depends_on: []
    max_new_training_jobs: 0
    scope: available_evidence_only
    status: "usable now for a professor_summary reflecting P0-v2 findings; final_research_report/paper_experiment_outline premature until E1/E2 actually run"

