    gpu_ids_available: [0, 1]           # RECONFIRMED 2026-09-29: BOTH BUSY (pid 730468/730625, ~62GB/61GB used, someone else's job -- NOT ours, not touched) -- unlike 2026-09-27's idle check, remote is currently unavailable
