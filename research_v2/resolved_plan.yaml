    gpu_ids_designated_for_evaluation: [0, 1] # RESOLVED per user authorization 2026-09-27

runtime:
  gpu_ids: {local: [0, 1], remote_mando_h100_2: [0, 1]}   # RESOLVED for E1/E2 evaluation use; no training gpu_ids set (no training this pass)
  expected_world_size: 2
  max_gpu_hours: 60                     # RESOLVED 2026-09-29: E3 training authorized ("계속 진행해줘, 학습 예산 갱신하고"). Estimate: 2 runs (n010_f050, n010_f100) x ~20 GPU-hours each (12 epoch, 2 GPU, based on l025's observed ~10h wall-clock x 2 GPU), +headroom.
  max_disk_gb: 2000                     # RESOLVED: 2TB cap on /NAS (30TB free measured 2026-09-27), logits written to /NAS not local overlay (local disk only 86GB free)
  free_disk_reserve_gb: {local: 30000, remote_mando_h100_2: 11000}  # RESOLVED (carried from v1, re-usable, filesystem hasn't changed)
  do_not_interrupt_existing_jobs: true
  use_existing_environment: true        # RESOLVED: torch 2.4.0+cu124, mmcv 2.1.0, mmdet3d 1.3.0, mmengine 0.10.3
  max_evaluation_gpu_hours: 40           # RESOLVED per user authorization 2026-09-27 -- generous cap for E1 (logit export + bias sweep) + E2 (regression + decomposition runs), well above the ~5-17 GPU-hour estimate in E1/E2 execution plans
