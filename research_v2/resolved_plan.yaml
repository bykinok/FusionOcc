    gpu_ids_designated_for_evaluation: [0, 1] # RESOLVED per user authorization 2026-09-27 ("문제가 되지 않는 한 자원을 충분히 활용해줘")
  remote_mando_h100_2:
    ssh_alias: mando-h100_2
