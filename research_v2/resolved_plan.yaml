annotation_contract:
  label_validity_source: "Occ3D GT generation pipeline (external); ignore_index=255 is a purely local, code-injected training-policy sentinel, never present in raw dataset files -- see annotation_manifest.json finding_label_validity_source"
  precomputed_camera_mask_in_final_weight: false   # matches template default; the lambda mechanism uses a continuous weight keyed BY the mask's spatial pattern, not the mask value itself in the loss formula
  recomputed_gt_visibility_allowed_as_baseline: true
  recomputed_visibility_is_visibility_free: false
  lidar_mask_for_validity_dependency: "AUDITED AND DECLARED: mask_lidar exists in raw data but is used NOWHERE in this codebase -- confirmed via exhaustive grep, see annotation_manifest.json finding_mask_lidar_unused"
  gt_unknown_as_free_allowed: false
  future_images_in_model_input: false
  future_training_poses_as_target_geometry: "N/A for training (target is always reference-frame GT) -- SEPARATE finding: RayIoU EVALUATION origins include future-relative-to-reference ego poses, see protocol_manifest.json v2_new_items.rayiou_origin_scope. Not conflated with training target geometry."
  historical_gt_for_diagnostic: "AVAILABILITY UNKNOWN, not checked this pass -- see annotation_manifest.json open_items_for_e4"
  changing_final_annotation_scope_requires_review: true

